<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Simulador de Comissões - Terra Fibra</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body { margin: 0; min-height: 100vh; background: var(--cor-fundo, #f3f4f6); }
    body {
      visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--cor-texto, #111827);
    }
    body.autenticado { visibility: visible; }

    .container-painel {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .painel-card {
      background: var(--cor-superficie, #ffffff);
      border: 1px solid var(--cor-borda, #d1d5db);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .campo { margin-bottom: 14px; }
    .campo label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
    .campo input, .campo select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--cor-borda, #d1d5db);
      font-size: 0.95rem;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .resultado-simulacao {
      background: var(--cor-fundo-input-ativo, #eef2ff);
      border: 1px solid var(--cor-borda-foco, #c7d2fe);
      padding: 18px;
      border-radius: 10px;
      margin-top: 16px;
      text-align: center;
    }

    .valor-destaque {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--cor-primaria, #2563eb);
    }

    .box-notificacao {
      background-color: #fef3c7;
      border: 1px solid #fde68a;
      color: #92400e;
      padding: 14px;
      border-radius: 8px;
      margin-top: 14px;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .btn-whatsapp {
      display: inline-block;
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background-color: #25D366;
      color: #fff;
      font-weight: 600;
      text-align: center;
      border-radius: 8px;
      text-decoration: none;
      box-sizing: border-box;
    }

    .btn-sair {
      width: 100%;
      padding: 10px;
      font-weight: 600;
      color: var(--cor-erro, #b91c1c);
      background: var(--cor-erro-fundo, #fef2f2);
      border: 1px solid var(--cor-erro-borda, #fca5a5);
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container-painel">
    
    <main class="painel-card">
      <h1 id="saudacao" style="margin:0 0 6px; font-size:1.4rem;">Olá!</h1>
      <div style="font-size:0.9rem; color:#6b7280;">Telefone: <span id="numero-usuario">--</span></div>
    </main>

    <section class="painel-card">
      <h2 style="margin-top:0; font-size:1.2rem;">Simulador de Comissões</h2>
      
      <div class="campo">
        <label for="canal-vendas">Canal / Cargo</label>
        <select id="canal-vendas">
          <option value="pap">Consultor PAP</option>
          <option value="callcenter">Consultor Call Center</option>
          <option value="digital">Consultor Digital</option>
          <option value="lider">Líder (PAP / Call Center / Digital)</option>
          <option value="executivo">Executivo de Vendas</option>
        </select>
      </div>

      <div class="campo" id="box-venda-total">
        <label for="venda-instalada">Receita de Venda Instalada (R$)</label>
        <input type="number" id="venda-instalada" placeholder="Ex: 3000" value="3000">
      </div>

      <div class="campo" id="box-meta" style="display:none;">
        <label for="meta-mes">Meta do Mês (R$)</label>
        <input type="number" id="meta-mes" placeholder="Ex: 4000" value="4000">
      </div>

      <div class="campo" id="box-novo-colaborador">
        <label class="checkbox-container">
          <input type="checkbox" id="chk-novo-colaborador">
          <span>Admitido nos últimos 3 meses (Piso R$ 300)</span>
        </label>
      </div>

      <button type="button" id="btn-calcular" class="btn" style="margin-top:8px;">Calcular Comissão</button>

      <!-- RESULTADO -->
      <div class="resultado-simulacao" id="box-resultado">
        <div style="font-size:0.85rem; color:#4b5563;">Comissão Estimada</div>
        <div class="valor-destaque" id="rv-total-exibida">R$ 0,00</div>
        <div id="detalhes-calculo" style="font-size:0.85rem; color:#6b7280; margin-top:4px;"></div>
      </div>

      <!-- NOTIFICAÇÃO E DICA DE FAIXA -->
      <div id="box-notificacao" class="box-notificacao" style="display:none;">
        <div id="texto-notificacao"></div>
        <a id="btn-whatsapp" href="#" target="_blank" class="btn-whatsapp" style="display:none;">
          📲 Enviar Lembrete no WhatsApp
        </a>
      </div>
    </section>

    <div class="painel-card" style="padding:14px;">
      <button type="button" id="btn-sair" class="btn-sair">Sair da Conta</button>
    </div>

  </div>

  <script type="module" src="js/home.js"></script>
</body>
</html>
