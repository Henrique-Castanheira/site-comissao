<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Início</title>
  <style>
    /* Fica oculta até a sessão ser validada (evita "piscar" antes do redirecionamento). */
    html, body { margin: 0; min-height: 100%; background: #f4f5f7; }
    body {
      visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: #1f2328;
    }
    body.autenticado { visibility: visible; }
    .home {
      width: 100%;
      max-width: 420px;
      padding: 32px 28px;
      background: #fff;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 1.5rem; font-weight: 600; }
    .info { margin: 0 0 20px; color: #5b6470; }
    .mensagem { margin: 0; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="home">
    <h1 id="saudacao"></h1>
    <p class="info">Telefone: <span id="numero-usuario"></span></p>
    <p class="mensagem" id="mensagem-home">
      Seu acesso está ativo. Novas funcionalidades serão adicionadas em breve.
    </p>
  </main>

  <script type="module" src="js/home.js"></script>
</body>
</html>
