<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Painel & Simulador - Terra Fibra</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body { margin: 0; min-height: 100vh; background: var(--cor-fundo, #f3f4f6); }
    body {
      visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 16px;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--cor-texto, #111827);
    }
    body.autenticado { visibility: visible; }

    .container-painel {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .painel-card {
      background: var(--cor-superficie, #ffffff);
      border: 1px solid var(--cor-borda, #d1d5db);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .usuario-detalhes {
      background-color: var(--cor-fundo, #f9fafb);
      border: 1px solid var(--cor-borda, #e5e7eb);
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 12px;
    }

    .item-detalhe {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 0.9rem;
    }

    .calc-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
    }

    .resultado-simulacao {
      background: var(--cor-fundo-input-ativo, #eef2ff);
      border: 1px solid var(--cor-borda-foco, #c7d2fe);
      padding: 16px;
      border-radius: 8px;
      margin-top: 16px;
      text-align: center;
    }

    .valor-destaque {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--cor-primaria, #2563eb);
    }

    .btn-sair {
      width: 100%;
      padding: 11px 16px;
      font-weight: 600;
      color: var(--cor-erro, #b91c1c);
      background: var(--cor-erro-fundo, #fef2f2);
      border: 1px solid var(--cor-erro-borda, #fca5a5);
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container-painel">
    
    <!-- CARD DE PERFIL -->
    <main class="painel-card">
      <h1 id="saudacao" style="margin:0;">Olá!</h1>
      <p style="color:#6b7280; margin:4px 0 12px;">Bem-vindo ao portal de comissões Terra Fibra</p>

      <div class="usuario-detalhes">
        <div class="item-detalhe"><span style="font-weight:600;">Nome:</span> <span id="nome-usuario">--</span></div>
        <div class="item-detalhe"><span style="font-weight:600;">Telefone:</span> <span id="numero-usuario">--</span></div>
      </div>
    </main>

    <!-- CALCULADORA DE COMISSÃO -->
    <section class="painel-card">
      <h2>Simulador de Comissões</h2>
      
      <div class="calc-box">
        <div class="campo">
          <label for="canal-vendas">Canal / Cargo</label>
          <select id="canal-vendas" style="width:100%; padding:10px; border-radius:8px; border:1px solid #d1d5db;">
            <option value="pap">Consultor PAP</option>
            <option value="callcenter">Consultor Call Center</option>
            <option value="digital">Consultor Digital</option>
            <option value="lider">Líder (PAP / Call Center / Digital)</option>
            <option value="executivo">Executivo de Vendas</option>
          </select>
        </div>

        <div class="campo" id="box-venda-total">
          <label for="venda-instalada">Venda Instalada no Mês (R$)</label>
          <input type="number" id="venda-instalada" placeholder="Ex: 2500" value="2500">
        </div>

        <div class="campo" id="box-meta" style="display:none;">
          <label for="meta-mes">Meta Estipulada (R$)</label>
          <input type="number" id="meta-mes" placeholder="Ex: 4000" value="4000">
        </div>

        <div class="campo" id="box-qualidade">
          <label for="indice-qualidade">Índice de Qualidade (%)</label>
          <input type="number" id="indice-qualidade" placeholder="Ex: 87" value="87">
        </div>

        <button type="button" id="btn-calcular" class="btn">Calcular Comissão</button>
      </div>

      <div class="resultado-simulacao" id="box-resultado">
        <div style="font-size:0.9rem; color:#4b5563;">Comissão Estimada (RV Total)</div>
        <div class="valor-destaque" id="rv-total-exibida">R$ 0,00</div>
        <div id="detalhes-calculo" style="font-size:0.85rem; color:#6b7280; margin-top:6px;"></div>
      </div>
    </section>

    <!-- BOTÃO SAIR -->
    <div class="painel-card" style="padding:16px;">
      <button type="button" id="btn-sair" class="btn-sair">Sair da Conta</button>
    </div>

  </div>

  <script type="module" src="js/home.js"></script>
</body>
</html>
